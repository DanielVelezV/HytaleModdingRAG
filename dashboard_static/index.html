<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hytale Modding RAG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f7;
    --surface: #ffffff;
    --surface-hover: #f9fafb;
    --border: #e3e5e8;
    --border-light: #f1f2f4;
    --text: #1a1c20;
    --text2: #6d7175;
    --text3: #8c9196;
    --green: #29845a;
    --green-bg: #e3f1df;
    --green-light: #f1f8ef;
    --red: #d72c0d;
    --red-bg: #fde8e8;
    --orange: #b98900;
    --orange-bg: #fef8e8;
    --blue: #2c6ecb;
    --blue-bg: #e4effa;
    --purple: #7c3aed;
    --purple-bg: #f3f0ff;
    --purple-light: #ede9fe;
    --teal: #0d9488;
    --teal-bg: #e6f6f4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 10;
  }

  .sidebar-brand {
    padding: 24px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .sidebar-brand .logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--purple) 0%, #a78bfa 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(124,58,237,0.3);
  }
  .sidebar-brand h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .sidebar-brand .version { font-size: 11px; color: var(--text3); font-weight: 500; }

  .sidebar-nav { padding: 16px 12px; flex: 1; }

  .nav-section { margin-bottom: 24px; }
  .nav-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0 8px;
    margin-bottom: 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active {
    background: var(--purple-bg);
    color: var(--purple);
    font-weight: 600;
  }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
  .nav-item .nav-badge {
    margin-left: auto;
    background: var(--bg);
    color: var(--text3);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .nav-item.active .nav-badge { background: rgba(124,58,237,0.15); color: var(--purple); }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-light);
  }
  .ollama-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text3);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }

  /* ─── Main Content ─── */
  .main { margin-left: 260px; flex: 1; min-height: 100vh; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar h2 { font-size: 18px; font-weight: 700; }
  .topbar .breadcrumb { color: var(--text3); font-size: 13px; margin-left: 12px; }

  .content { padding: 28px 32px; }

  .panel { display: none; animation: fadeIn 0.2s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ─── Overview Cards ─── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .stat-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--purple);
  }
  .stat-card .stat-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .stat-card .stat-label {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .stat-card .stat-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .stat-card .stat-sub {
    font-size: 12px;
    color: var(--text3);
    margin-top: 6px;
  }
  .stat-card .stat-decoration {
    position: absolute;
    right: -8px;
    bottom: -8px;
    font-size: 64px;
    opacity: 0.05;
  }

  /* ─── Source Cards ─── */
  .source-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    transition: all 0.2s;
  }
  .source-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .source-card .source-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .source-card .source-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .source-card h3 { font-size: 15px; font-weight: 700; flex: 1; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.red { background: var(--red-bg); color: var(--red); }

  .source-card .source-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-light);
  }
  .source-card .mini-stat .mini-label {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .source-card .mini-stat .mini-value {
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
  }

  .source-card .progress-bar {
    height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    margin-top: 16px;
    overflow: hidden;
  }
  .source-card .progress-bar .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ─── Search ─── */
  .search-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 20px;
  }
  .search-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-input-wrap {
    flex: 1;
    min-width: 300px;
    position: relative;
  }
  .search-input-wrap .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text3);
  }
  .search-input-wrap input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input-wrap input:focus { border-color: var(--purple); }
  .search-input-wrap input::placeholder { color: var(--text3); }

  .search-select {
    padding: 12px 16px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .search-select:focus { border-color: var(--purple); }

  .search-btn {
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--purple) 0%, #a78bfa 100%);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(124,58,237,0.3);
  }
  .search-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,0.4); }

  .search-filters {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 6px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--purple); color: var(--purple); }
  .filter-chip.active { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }

  .results-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    transition: all 0.15s;
  }
  .result-card:hover { border-color: var(--purple); box-shadow: var(--shadow-sm); }

  .result-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .result-source {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .result-source.api { background: var(--purple-bg); color: var(--purple); }
  .result-source.guide { background: var(--green-bg); color: var(--green); }
  .result-source.mod { background: var(--orange-bg); color: var(--orange); }
  .result-title { font-weight: 700; font-size: 14px; }
  .result-subtitle { font-size: 12px; color: var(--text3); }
  .result-similarity {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .sim-high { background: var(--green-bg); color: var(--green); }
  .sim-mid { background: var(--orange-bg); color: var(--orange); }
  .sim-low { background: var(--red-bg); color: var(--red); }

  .result-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .result-meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text3);
  }

  .result-code {
    background: #1e1e2e;
    color: #cdd6f4;
    border-radius: 8px;
    padding: 14px 16px;
    font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
  }

  /* ─── Repos Grid ─── */
  .repos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .repo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
  }
  .repo-card:hover { border-color: var(--purple); box-shadow: var(--shadow-sm); }
  .repo-card .repo-icon {
    width: 36px;
    height: 36px;
    background: var(--bg);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .repo-card .repo-name { font-size: 13px; font-weight: 600; }
  .repo-card .repo-info { font-size: 11px; color: var(--text3); }

  /* ─── Diff ─── */
  .diff-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 16px;
  }
  .diff-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .diff-item {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Cascadia Code', monospace;
    margin-bottom: 4px;
  }
  .diff-item.added { background: var(--green-light); color: var(--green); }
  .diff-item.removed { background: #fef2f2; color: var(--red); }
  .diff-item.modified { background: var(--orange-bg); color: #92400e; }
  .diff-detail { font-size: 11px; color: var(--text3); padding-left: 20px; font-family: inherit; }

  /* ─── Logs ─── */
  .log-container {
    background: #1e1e2e;
    border-radius: var(--radius-lg);
    padding: 20px;
    max-height: 600px;
    overflow-y: auto;
    font-family: 'Cascadia Code', 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  .log-entry { display: flex; gap: 16px; }
  .log-time { color: #585b70; min-width: 70px; }
  .log-level { min-width: 55px; font-weight: 700; }
  .log-level.INFO { color: #89b4fa; }
  .log-level.WARNING { color: #f9e2af; }
  .log-level.ERROR { color: #f38ba8; }
  .log-msg { color: #cdd6f4; }

  /* ─── Empty State ─── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-state .empty-icon {
    width: 80px;
    height: 80px;
    background: var(--purple-bg);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 16px;
  }
  .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

  /* ─── Responsive ─── */
  @media (max-width: 1200px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .source-grid { grid-template-columns: 1fr; } }
  @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } .stats-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">H</div>
    <div>
      <h1>Hytale RAG</h1>
      <div class="version">MCP Server v1.0</div>
    </div>
  </div>

  <div class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-label">Dashboard</div>
      <button class="nav-item active" data-panel="overview">
        <span class="icon">&#127968;</span> Overview
      </button>
      <button class="nav-item" data-panel="search">
        <span class="icon">&#128269;</span> Search
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Data Sources</div>
      <button class="nav-item" data-panel="api-source">
        <span class="icon">&#9881;&#65039;</span> Java API
        <span class="nav-badge" id="nav-api-count">-</span>
      </button>
      <button class="nav-item" data-panel="guides-source">
        <span class="icon">&#128214;</span> Guides
        <span class="nav-badge" id="nav-guides-count">-</span>
      </button>
      <button class="nav-item" data-panel="mods-source">
        <span class="icon">&#128230;</span> GitHub Mods
        <span class="nav-badge" id="nav-mods-count">-</span>
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Tools</div>
      <button class="nav-item" data-panel="diff">
        <span class="icon">&#128203;</span> API Diff
      </button>
      <button class="nav-item" data-panel="logs">
        <span class="icon">&#128196;</span> Logs
      </button>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="ollama-status">
      <span class="status-dot" id="ollama-dot"></span>
      <span id="ollama-label">Checking Ollama...</span>
    </div>
  </div>
</nav>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h2 id="page-title">Overview</h2>
    <span class="breadcrumb" id="page-breadcrumb"></span>
  </div>

  <div class="content">

    <!-- OVERVIEW -->
    <div class="panel active" id="panel-overview">
      <div class="stats-row" id="stats-row"></div>
      <div class="source-grid" id="source-grid"></div>
    </div>

    <!-- SEARCH -->
    <div class="panel" id="panel-search">
      <div class="search-container">
        <div class="search-row">
          <div class="search-input-wrap">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="search-query" placeholder="Search across Hytale API, guides, and mods...">
          </div>
          <select class="search-select" id="search-source">
            <option value="all">All Sources</option>
            <option value="api">Java API</option>
            <option value="guides">Guides</option>
            <option value="mods">Mods</option>
          </select>
          <button class="search-btn" onclick="doSearch()">Search</button>
        </div>
        <div class="search-filters">
          <input type="text" class="filter-chip" id="search-package" placeholder="Package filter..." style="border:1px solid var(--border);background:var(--bg);outline:none;width:200px;padding:6px 14px;border-radius:20px;font-size:12px;font-family:inherit;color:var(--text)">
        </div>
      </div>
      <div id="results-area"></div>
    </div>

    <!-- API SOURCE -->
    <div class="panel" id="panel-api-source">
      <div id="api-detail"></div>
    </div>

    <!-- GUIDES SOURCE -->
    <div class="panel" id="panel-guides-source">
      <div id="guides-detail"></div>
    </div>

    <!-- MODS SOURCE -->
    <div class="panel" id="panel-mods-source">
      <div id="mods-detail"></div>
    </div>

    <!-- DIFF -->
    <div class="panel" id="panel-diff">
      <div id="diff-content"></div>
    </div>

    <!-- LOGS -->
    <div class="panel" id="panel-logs">
      <div class="log-container" id="log-container">
        <div class="empty-state" style="padding:40px">
          <div class="empty-icon" style="width:60px;height:60px;font-size:24px;margin:0 auto 12px">&#128196;</div>
          <p style="color:#585b70">Logs appear here when the dashboard runs alongside the MCP server</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const PAGE_TITLES = {
  overview: 'Overview',
  search: 'Search',
  'api-source': 'Java API',
  'guides-source': 'Community Guides',
  'mods-source': 'GitHub Mods',
  diff: 'API Diff',
  logs: 'Logs',
};
const PAGE_CRUMBS = {
  overview: '',
  search: 'Search across all indexed sources',
  'api-source': 'Data Sources / Java API',
  'guides-source': 'Data Sources / Community Guides',
  'mods-source': 'Data Sources / GitHub Mods',
  diff: 'Tools / Version Diff',
  logs: 'Tools / Server Logs',
};

// Navigation
$$('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    const panel = item.dataset.panel;
    $$('.nav-item').forEach(n => n.classList.remove('active'));
    $$('.panel').forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    $(`#panel-${panel}`).classList.add('active');
    $('#page-title').textContent = PAGE_TITLES[panel] || panel;
    $('#page-breadcrumb').textContent = PAGE_CRUMBS[panel] || '';
  });
});

function fmt(n) { return n != null ? Number(n).toLocaleString() : '-'; }
function fmtDate(iso) {
  if (!iso) return 'Never';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 3600000) return Math.round(diff/60000) + ' min ago';
  if (diff < 86400000) return Math.round(diff/3600000) + 'h ago';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
}
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Status
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const d = await res.json();
    renderOverview(d);
    renderSources(d);
    renderOllama(d.ollama);
    $('#nav-api-count').textContent = fmt(d.api.chunks);
    $('#nav-guides-count').textContent = fmt(d.guides.chunks);
    $('#nav-mods-count').textContent = fmt(d.mods.chunks);
  } catch(e) { console.error(e); }
}

function renderOllama(o) {
  const dot = $('#ollama-dot');
  const label = $('#ollama-label');
  if (o.status === 'running') {
    dot.className = 'status-dot online';
    label.textContent = 'Ollama online (' + o.models.length + ' models)';
  } else {
    dot.className = 'status-dot offline';
    label.textContent = 'Ollama offline';
  }
}

// Search
async function doSearch() {
  const query = $('#search-query').value.trim();
  const source = $('#search-source').value;
  const pkg = $('#search-package').value.trim();
  if (!query) return;

  const area = $('#results-area');
  area.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)">Searching...</div>';

  try {
    let url = `/api/search?q=${encodeURIComponent(query)}&source=${source}&limit=10`;
    if (pkg) url += `&package=${encodeURIComponent(pkg)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.results || !data.results.length) {
      area.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128269;</div><h3>No results found</h3><p>Try different keywords or broaden your search source.</p></div>`;
      return;
    }

    let html = `<div class="results-header">Found <strong>${data.count}</strong> results for "<strong>${esc(query)}</strong>"</div>`;
    html += data.results.map(r => {
      const simClass = r.similarity > 0.7 ? 'sim-high' : r.similarity > 0.5 ? 'sim-mid' : 'sim-low';
      let title = r.fqn || r.title || r.repo || 'Unknown';
      let metas = [];
      if (r.package) metas.push(`&#128230; ${r.package}`);
      if (r.method_name) metas.push(`&#9881;&#65039; ${r.method_name}`);
      if (r.heading) metas.push(`&#128214; ${r.heading}`);
      if (r.repo) metas.push(`&#128230; ${r.repo}`);
      if (r.extends) metas.push(`&#8593; extends ${r.extends}`);
      if (r.implements) metas.push(`&#9733; implements ${r.implements}`);

      return `<div class="result-card">
        <div class="result-top">
          <span class="result-source ${r.source}">${r.source.toUpperCase()}</span>
          <span class="result-title">${esc(title)}</span>
          <span class="result-similarity ${simClass}">${r.similarity !== null ? (r.similarity*100).toFixed(1)+'%' : ''}</span>
        </div>
        ${metas.length ? `<div class="result-meta">${metas.map(m => `<span class="result-meta-item">${m}</span>`).join('')}</div>` : ''}
        <div class="result-code">${esc(r.text)}</div>
      </div>`;
    }).join('');

    area.innerHTML = html;
  } catch(e) {
    area.innerHTML = `<div style="color:var(--red);padding:20px">Error: ${e.message}</div>`;
  }
}

$('#search-query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// Diff
async function loadDiff() {
  const el = $('#diff-content');
  try {
    const res = await fetch('/api/diff');
    if (res.status === 404) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128203;</div><h3>No API diff yet</h3><p>A diff is generated automatically when you re-index with a new HytaleServer.jar version. It shows which classes, methods, and fields changed between versions.</p></div>`;
      return;
    }
    const data = await res.json();
    let html = '';
    if (data.summary) html += `<div class="diff-card"><h3>&#128203; Summary</h3><p style="color:var(--text2);font-size:13px;line-height:1.6">${esc(data.summary)}</p></div>`;

    if (data.added_classes && data.added_classes.length) {
      html += `<div class="diff-card"><h3><span style="color:var(--green)">+</span> Added Classes (${data.added_classes.length})</h3>`;
      data.added_classes.slice(0,50).forEach(c => html += `<div class="diff-item added">+ ${esc(c)}</div>`);
      if (data.added_classes.length > 50) html += `<div style="color:var(--text3);font-size:12px;padding:8px">...and ${data.added_classes.length-50} more</div>`;
      html += `</div>`;
    }
    if (data.removed_classes && data.removed_classes.length) {
      html += `<div class="diff-card"><h3><span style="color:var(--red)">-</span> Removed Classes (${data.removed_classes.length})</h3>`;
      data.removed_classes.slice(0,50).forEach(c => html += `<div class="diff-item removed">- ${esc(c)}</div>`);
      html += `</div>`;
    }
    if (data.modified_classes && data.modified_classes.length) {
      html += `<div class="diff-card"><h3><span style="color:var(--orange)">~</span> Modified Classes (${data.modified_classes.length})</h3>`;
      data.modified_classes.slice(0,50).forEach(c => {
        html += `<div class="diff-item modified">~ ${esc(c.fqn)}</div>`;
        if (c.changes) c.changes.forEach(ch => html += `<div class="diff-detail">${esc(ch)}</div>`);
      });
      html += `</div>`;
    }
    if (!html) html = `<div class="empty-state"><div class="empty-icon">&#9989;</div><h3>No changes detected</h3><p>The API is identical between the two indexed versions.</p></div>`;
    el.innerHTML = html;
  } catch(e) { el.innerHTML = `<div style="color:var(--red)">Error loading diff</div>`; }
}

// Logs
async function loadLogs() {
  try {
    const res = await fetch('/api/logs');
    const logs = await res.json();
    if (!logs.length) return;
    const el = $('#log-container');
    el.innerHTML = logs.map(l => `<div class="log-entry"><span class="log-time">${l.time}</span><span class="log-level ${l.level}">${l.level}</span><span class="log-msg">${esc(l.message)}</span></div>`).join('');
    el.scrollTop = el.scrollHeight;
  } catch(e) {}
}

// Init
loadStatus();
loadDiff();
setInterval(loadStatus, 30000);
setInterval(loadLogs, 5000);
</script>
