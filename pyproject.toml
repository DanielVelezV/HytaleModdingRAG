[project]
name = "hytale-docs-mcp"
version = "1.0.0"
description = "MCP server for Hytale Java API docs RAG — decompiled Javadocs + community guides"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ollama>=0.4.0",
    "flask>=3.0.0",
    "numpy>=1.26.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
hytale-rag = "cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "cli", "config", "indexer", "java_parser", "fts",
    "scraper", "github_scraper", "decompiler", "diffing", "snapshots",
    "server", "dashboard",
]
